# Render Blueprint — deploy backend + PostgreSQL
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: buildflow-api
    runtime: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build && npx prisma generate
    startCommand: npx prisma migrate deploy && npm run db:seed && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: buildflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://akashsrivastava626262-wq.github.io
      - key: API_BASE_URL
        value: https://buildflow-api.onrender.com
      - key: ADMIN_EMAIL
        value: akashsrivastava626262@gmail.com

databases:
  - name: buildflow-db
    plan: free
    region: singapore
