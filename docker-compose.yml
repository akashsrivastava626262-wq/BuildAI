version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: buildflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: buildflow
      POSTGRES_PASSWORD: buildflow_secret
      POSTGRES_DB: buildflow
    ports:
      - '5432:5432'
    volumes:
      - buildflow_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U buildflow -d buildflow']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  buildflow_pg_data:
